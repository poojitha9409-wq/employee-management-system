<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Employee</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
            transition: 0.3s;
        }

        .form-container {
            max-width: 650px;
            margin: 45px auto;
            padding: 20px;
        }

        .form-card {
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-top: 16px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 13px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            font-size: 15px;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #2563eb;
        }

        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        .update-btn {
            flex: 1;
            padding: 13px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-size: 15px;
        }

        .cancel-btn {
            flex: 1;
            padding: 13px;
            background: #6b7280;
            color: white;
            text-align: center;
            text-decoration: none;
            border-radius: 7px;
        }

        /* DARK MODE */

        body.dark-mode {
            background: #111827;
            color: white;
        }

        body.dark-mode .form-card {
            background: #1f2937;
        }

        body.dark-mode input,
        body.dark-mode select {
            background: #374151;
            color: white;
            border-color: #4b5563;
        }

    </style>

</head>


<body>

{% include "navbar.html" %}


<div class="form-container">

    <div class="form-card">

        <h1>
            ✏️ Edit Employee
        </h1>


        <form method="POST">

            <label>Employee Name</label>

            <input type="text"name="name"value="{{ employee.name }}"required>


            <label>Email</label>

            <input type="email"name="email"value="{{ employee.email }}"required>


            <label>Phone</label>

            <input type="text" name="phone" value="{{ employee.phone or '' }}">


            <label>Department</label>

            <select name="department" required>

                <option value="IT"
                    {% if employee.department == "IT" %}selected{% endif %}>
                    IT
                </option>

                <option value="HR"
                    {% if employee.department == "HR" %}selected{% endif %}>
                    HR
                </option>

                <option value="Finance"
                    {% if employee.department == "Finance" %}selected{% endif %}>
                    Finance
                </option>

                <option value="Marketing"
                    {% if employee.department == "Marketing" %}selected{% endif %}>
                    Marketing
                </option>

                <option value="Sales"
                    {% if employee.department == "Sales" %}selected{% endif %}>
                    Sales
                </option>

            </select>


            <label>Position </label>

            <input type="text" name="position"value="{{ employee.position }}"required>


            <label>Salary</label>

            <input type="number"name="salary"value="{{ employee.salary }}"required>

            <div class="form-group">

               <label>address</label>

               <input type="text area"name="address"value="{{ employee['address'] }}"required>

                <label>Joining Date</label>

               <input type="date"name="joining_date"value="

            </div>
            <div class="button-group">

                <button
                    type="submit"
                    class="update-btn">

                    Update Employee

                </button>

                <a
                    href="{{ url_for('employee') }}"
                    class="cancel-btn">

                    Cancel

                </a>

            </div>

        </form>

    </div>

</div>

</body>

</html>
