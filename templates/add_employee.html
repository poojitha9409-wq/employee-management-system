<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Employee</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
            transition: 0.3s;
        }

        .form-container {
            max-width: 650px;
            margin: 45px auto;
            padding: 20px;
        }

        .form-card {
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .form-card h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-top: 16px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 13px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            font-size: 15px;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #2563eb;
        }

        .primary-btn {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            border: none;
            border-radius: 7px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .primary-btn:hover {
            background: #1d4ed8;
        }

        /* DARK MODE */

        body.dark-mode {
            background: #111827;
            color: #f9fafb;
        }

        body.dark-mode .form-card {
            background: #1f2937;
        }

        body.dark-mode input,
        body.dark-mode select {
            background: #374151;
            color: white;
            border-color: #4b5563;
        }

    </style>

</head>


<body>

{% include "navbar.html" %}


<div class="form-container">

    <div class="form-card">

        <h1>
            ➕ Add Employee
        </h1>


        <form method="POST">

            <label>Employee Name</label>

            <input type="text" name="name" placeholder="Enter employee name" required>


            <label>Email</label>

            <input type="email" name="email" placeholder="Enter email"required>


            <label>Phone Number </label>

            <input type="text" name="phone" placeholder="Enter phone number">


            <label>Department</label>

            <select name="department" required>

                <option value="">Select Department</option>

                <option value="IT">IT</option>

                <option value="HR">HR</option>

                <option value="Finance">Finance</option>

                <option value="Marketing">Marketing</option>

                <option value="Sales">Sales</option>

            </select>


            <label>Position</label>

            <input type="text" name="position" placeholder="Enter position" required>

            <div class="form-group">

           <label>Joining Date</label>

             <input type="date"name="joining_date" required>

           </div>
            <label>Salary</label>

            <input type="number" name="salary" placeholder="Enter salary" required>
 
            <label>address</label>

            <input type="text area" name="address" placeholder="Enter address" required>


            <button
                type="submit" class="primary-btn">Add Employee</button>

        </form>

    </div>

</div>

</body>

</html>
